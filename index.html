<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>Shopbook | فَلْيَكْتُبْ</title>
    
    <base href="/" />
    
    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <link rel="manifest" href="/manifest.json" />
    
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    
    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="فَلْيَكْتُبْ" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <!-- The opening screen's first picture, painted before any script runs:
         the APP ICON on brand green, same size and spot as Android's launch
         window (launch_green.xml / splash_app_icon.xml) and SplashIntro.tsx,
         which removes this the moment it mounts. Inline on purpose — no
         stylesheet has loaded yet. -->
    <div id="boot-splash" style="position:fixed;inset:0;z-index:300000;background:#1b5e20">
      <svg viewBox="18 18 72 72" width="160" height="160" style="position:absolute;top:50%;left:50%;margin:-80px 0 0 -80px">
          <clipPath id="spl-c"><circle cx="54" cy="54" r="36"/></clipPath>
          <g clip-path="url(#spl-c)">
            <rect width="108" height="108" fill="#2E7D32"/>
            <circle cx="54" cy="54" r="46" fill="#37903C"/>
            <path fill="#FBF3E3" d="M39,31 H69 A5,5 0 0 1 74,36 V72 A5,5 0 0 1 69,77 H39 A5,5 0 0 1 34,72 V36 A5,5 0 0 1 39,31 Z"/>
            <path stroke="#E24C4B" stroke-width="2.5" stroke-linecap="round" d="M41,38 L41,70"/>
            <path stroke="#9DB6C7" stroke-width="2.8" stroke-linecap="round" d="M46,44 L68,44 M46,54 L68,54 M46,64 L56,64"/>
            <circle cx="68" cy="68" r="10" fill="#F6C445"/>
            <circle cx="68" cy="68" r="6.5" fill="none" stroke="#DBA400" stroke-width="2"/>
          </g>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
