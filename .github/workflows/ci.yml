name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  app-tests:
    name: App unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # e2e (Cypress) is not run in CI; skip the large browser download.
          CYPRESS_INSTALL_BINARY: '0'

      - name: Copy sql.js wasm
        run: npm run copy-sql-wasm

      - name: Run unit tests
        run: npx vitest run

  server-tests:
    name: Server integration tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: daftar_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Load database schema
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot daftar_test < server/db/schema.sql

      - name: Write test env file
        working-directory: server
        run: |
          cat > .env.test <<'EOF'
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_USER=root
          DB_PASSWORD=root
          DB_NAME=daftar_test
          JWT_SECRET=test-secret-not-a-real-key
          EOF

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run integration tests
        working-directory: server
        run: npm test
